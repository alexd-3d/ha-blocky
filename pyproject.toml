[project]
name = "ha-blocky"
version = "0.5.0"
description = "Home Assistant custom integration for the Blocky DNS proxy"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # import sorting
  "B",    # bugbear
  "UP",   # pyupgrade
  "S",    # security (bandit rules)
  "SIM",  # simplifications
  "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Tests use assert and call git to list repository files.
"tests/*" = ["S101", "S105", "S106", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
